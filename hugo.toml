baseURL = 'https://gateofsteins.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'Gate of Steins'
theme = 'PaperMod'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  description = '网络安全、技术实践与学习笔记'
  author = 'Gate of Steins'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowLastMod = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # 自定义首页 Hero 背景图（可选），支持多张随机切换
  # 图片放在 static/images/ 目录下，每次刷新随机显示一张
  backgroundImages = ['/images/bg1.png']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/gateofsteins'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.35
    minMatchCharLength = 2
    keys = ['title', 'permalink', 'summary', 'content']

  # giscus 评论区配置（基于 GitHub Discussions）
  # 使用步骤：
  #   1. 在仓库 gateofsteins/gateofsteins.github.io 开启 Discussions
  #   2. 访问 https://giscus.app 安装 giscus 并获取 repoId 和 categoryId
  #   3. 把获取到的 ID 填入下面两项，评论区即生效
  # 未配置 repoId/categoryId 前，文章页不会渲染评论区
  [params.giscus]
    repo = 'gateofsteins/gateofsteins.github.io'
    repoId = ''
    category = 'Announcements'
    categoryId = ''
    mapping = 'pathname'
    strict = '0'
    reactionsEnabled = '1'
    emitMetadata = '0'
    inputPosition = 'top'
    lang = 'zh-CN'
    loading = 'lazy'

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 40
