baseURL = 'https://gateofsteins.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'Gate of Steins'
theme = 'PaperMod'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  description = '网络安全、技术实践与学习笔记'
  author = 'Gate of Steins'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowLastMod = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true

  # 自定义首页 Hero 背景图（可选），支持多张随机切换
  # 图片放在 static/images/ 目录下，每次刷新随机显示一张
  # backgroundImages = ['/images/bg1.png']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/gateofsteins'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.35
    minMatchCharLength = 2
    keys = ['title', 'permalink', 'summary', 'content']

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 40
