baseURL = 'https://gateofsteins.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'Gate of Steins'
theme = 'PaperMod'

[params]
  env = 'production'
  description = '网络安全、技术实践与学习笔记'
  author = 'Gate of Steins'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true

  [params.homeInfoParams]
    Title = '你好，欢迎来到 Gate of Steins 👋'
    Content = '记录网络安全、Hugo 建站与持续学习。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/gateofsteins'

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30
